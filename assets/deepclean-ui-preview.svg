<path d="M80 129v24m-8-16 8-8 8 8m-16 9 8 7 8-7" stroke="url(#cyan)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="118" y="139" class="ui" font-size="17" font-weight="800" letter-spacing=".5">DEEPCLEAN</text>
<text x="118" y="157" class="ui subtle eyebrow">OS / WORKSPACE</text>
<path d="M58 187h222" stroke="#283548"/>
<text x="58" y="229" class="ui" font-size="17" font-weight="800">CONFIGURATION</text>
