<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">DeepClean OS — Streamlit workspace preview</title>
<desc id="desc">A polished dark-mode preview of the DeepClean data-cleaning application, showing the configuration panel, CSV upload area, and awaiting-data status.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e14"/><stop offset="1" stop-color="#06090f"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172235"/><stop offset="1" stop-color="#101927"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00d4e8"/><stop offset="1" stop-color="#00a9d6"/></linearGradient>
  <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b121b"/><stop offset="1" stop-color="#0a1018"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .ui{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#e8eef8}
    .muted{fill:#91a1b8}.subtle{fill:#667992}.cyan{fill:#00c8e8}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.3px}
    .label{font-size:13px;font-weight:700;letter-spacing:1.15px;fill:#8fa0b8}
    .value{font-size:17px;fill:#e1e9f5}
    .tiny{font-size:10px;font-weight:700;letter-spacing:.7px;fill:#73869f}
  </style>
</defs>
<!-- outer browser frame -->
<rect x="18" y="18" width="1564" height="964" rx="26" fill="#0b1018" stroke="#344356" stroke-width="1.5"/>
<path d="M44 18h1512a26 26 0 0 1 26 26v39H18V44a26 26 0 0 1 26-26Z" fill="#101722"/>
<circle cx="48" cy="52" r="7" fill="#fb6b69"/><circle cx="72" cy="52" r="7" fill="#ffc24d"/><circle cx="96" cy="52" r="7" fill="#2bcf78"/>
<rect x="142" y="35" width="930" height="34" rx="12" fill="#080d14" stroke="#344356"/>
<path d="M166 47v-3a6 6 0 0 1 12 0v3" stroke="#8da2bc" fill="none" stroke-width="1.8"/>
<rect x="164" y="47" width="16" height="13" rx="3" fill="#172335" stroke="#51657d"/>
<text x="194" y="57" class="ui muted" font-size="16">https://deep-clean-os.streamlit.app</text>
<text x="1510" y="49" class="ui subtle eyebrow" text-anchor="end">STREAMLIT APP</text>
<!-- main surface / sidebar -->
<rect x="19" y="84" width="320" height="897" fill="#0a0f16"/>
<path d="M339 84v897" stroke="#2b394c" stroke-width="1.2"/>
<!-- brand -->
