<g fill="#00c8e8"><rect x="422" y="666" width="8" height="8" rx="2"/><rect x="435" y="666" width="8" height="8" rx="2"/><rect x="422" y="679" width="8" height="8" rx="2"/><rect x="435" y="679" width="8" height="8" rx="2"/></g>
<text x="478" y="676" class="ui" font-size="27" font-weight="800">Awaiting Data Payload...</text>
<text x="478" y="710" class="ui muted" font-size="17">Upload a CSV to begin automated cleaning.</text>
