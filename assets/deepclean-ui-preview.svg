<text x="76" y="544" class="value">3.0</text>
<path d="M62 602h214" stroke="#36485e" stroke-width="6" stroke-linecap="round"/>
<path d="M62 602h107" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
<circle cx="169" cy="602" r="10" fill="#0b1822" stroke="#00c8e8" stroke-width="3"/>
<text x="58" y="638" class="tiny">1.0</text><text x="278" y="638" class="tiny" text-anchor="end">5.0</text>
<path d="M58 684h222" stroke="#293749"/>
<rect x="58" y="710" width="220" height="58" rx="10" fill="#0b1d25" stroke="#1b7284"/>
<circle cx="80" cy="739" r="6" fill="#00c7e7"/>
<text x="99" y="744" class="ui muted" font-size="14" font-weight="700">Cloud-Optimized</text>
<text x="58" y="925" class="tiny">DEEP CLEANING · REPRODUCIBLE</text>
<!-- content body -->
<rect x="375" y="116" width="1103" height="222" rx="22" fill="#000" opacity=".28" filter="url(#shadow)"/>
<rect x="375" y="116" width="1103" height="222" rx="22" fill="url(#hero)" stroke="#52627a"/>
<rect x="422" y="151" width="176" height="31" rx="16" fill="#0b2b36" stroke="#00bcd9"/>
<circle cx="443" cy="166" r="4.5" fill="#00d3ec"/>
