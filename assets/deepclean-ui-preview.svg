<rect x="58" y="403" width="220" height="49" rx="9" fill="#131c29" stroke="#43536a"/>
<text x="76" y="433" class="value">mean</text><path d="m254 423 8 8 8-8" stroke="#a7b6c9" stroke-width="2" fill="none" stroke-linecap="round"/>
