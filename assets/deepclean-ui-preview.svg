<text x="422" y="247" class="ui" font-size="59" font-weight="800" letter-spacing="-1.4">DeepClean</text>
<text x="750" y="247" class="ui cyan" font-size="59" font-weight="300" letter-spacing="-1.5">OS</text>
<text x="424" y="284" class="ui muted" font-size="25" font-weight="400">Advanced Data Engineering Intelligence</text>
<text x="424" y="314" class="ui subtle tiny">A PRACTICAL WORKSPACE FOR REPEATABLE CSV CLEANING</text>
<rect x="1292" y="160" width="108" height="108" rx="22" fill="#0a2733" stroke="#00c8e8"/>
<g fill="#00c8e8">
  <rect x="1312" y="180" width="12" height="12" rx="4"/><rect x="1336" y="180" width="12" height="12" rx="4"/><rect x="1360" y="180" width="12" height="12" rx="4"/><rect x="1384" y="180" width="12" height="12" rx="4"/>
  <rect x="1312" y="204" width="12" height="12" rx="4"/><rect x="1336" y="204" width="12" height="12" rx="4"/><rect x="1360" y="204" width="12" height="12" rx="4"/><rect x="1384" y="204" width="12" height="12" rx="4"/>
  <rect x="1312" y="228" width="12" height="12" rx="4"/><rect x="1336" y="228" width="12" height="12" rx="4"/><rect x="1360" y="228" width="12" height="12" rx="4"/><rect x="1384" y="228" width="12" height="12" rx="4"/>
</g>
<!-- uploader -->
